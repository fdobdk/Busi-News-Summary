name: Daily News Digest

on:
  # Remember to change if statements below if updating time (or else GitHub won't run it)
  # schedule:
  #   - cron: '24 13 * * 0-4' #~8AM HKT
  #   - cron: '13 11 * * *' #~8AM EST
  workflow_dispatch:
    inputs:
      audience:
        description: 'Which subscriber list to send to'
        required: true
        default: 'both'
        type: choice
        options:
          - hk
          - est
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest-hk:
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.audience == 'hk' || github.event.inputs.audience == 'both'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run daily digest (HK)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py --subscribers subscribers/hkt.json

  digest-est:
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.audience == 'est' || github.event.inputs.audience == 'both'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run daily digest (EST)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py --subscribers subscribers/est.json
