name: Daily News Digest

on:
  schedule:
    - cron: '29 23 * * 0-4' # 7:59 AM HKT (UTC+8), Mon-Fri
    - cron: '19 11 * * *'   # 7:59 AM EST (UTC-5), every day
  workflow_dispatch:
    inputs:
      audience:
        description: 'Which subscriber list to send to'
        required: true
        default: 'both'
        type: choice
        options:
          - hk
          - est
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest-hk:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.audience == 'hk' || github.event.inputs.audience == 'both')
      || github.event_name == 'schedule' && github.event.schedule == '59 22 * * 0-4'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run daily digest (HK)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py --subscribers config/subscribers_hk.json

  digest-est:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.audience == 'est' || github.event.inputs.audience == 'both')
      || github.event_name == 'schedule' && github.event.schedule == '29 11 * * *'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run daily digest (EST)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py --subscribers config/subscribers_est.json
